<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Abolfazl — Computer Engineering Student">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#8b5cf6;#22d3ee" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#ec4899;#8b5cf6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#22d3ee;#ec4899" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2940" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.55"/>

  <!-- top gradient strip -->
  <rect width="1200" height="4" fill="url(#nameGrad)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD corner brackets -->
  <path d="M24 56 V24 H56" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.7"/>
  <path d="M1144 24 H1176 V56" fill="none" stroke="#8b5cf6" stroke-width="3" opacity="0.7"/>
  <path d="M1176 264 V296 H1144" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.7"/>
  <path d="M56 296 H24 V264" fill="none" stroke="#8b5cf6" stroke-width="3" opacity="0.7"/>

  <!-- circuit traces -->
  <g stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.35">
    <path d="M0 90 H210 L250 130 H330" stroke-dasharray="8 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M1200 90 H990 L950 130 H870" stroke-dasharray="8 10">
      <animate attributeName="stroke-dashoffset" from="0" to="36" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M0 250 H170 L210 210 H290" stroke="#8b5cf6" stroke-dasharray="8 10">
      <animate attributeName="stroke-dashoffset" from="0" to="36" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M1200 250 H1030 L990 210 H910" stroke="#8b5cf6" stroke-dasharray="8 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- circuit nodes -->
  <g fill="#22d3ee">
    <circle cx="210" cy="90" r="4">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="990" cy="90" r="4" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="250" r="4" fill="#8b5cf6">
      <animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="250" r="4">
      <animate attributeName="r" values="5;3;5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- rotating rings -->
  <g transform="translate(108,160)">
    <circle r="40" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="30 25" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="26" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="16 14" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#22d3ee" opacity="0.9">
      <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(1092,160)">
    <circle r="40" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="30 25" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="26" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="16 14" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#8b5cf6" opacity="0.9">
      <animate attributeName="r" values="9;6;9" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- moving scan beam -->
  <rect x="-80" y="0" width="70" height="320" fill="url(#scanGrad)">
    <animateTransform attributeName="transform" type="translate" from="0" to="1320" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- name -->
  <text x="600" y="160" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="86" font-weight="bold" letter-spacing="6" fill="url(#nameGrad)" filter="url(#glow)">ABOLFAZL</text>

  <!-- underline beam -->
  <rect x="330" y="184" width="540" height="4" rx="2" fill="url(#beamGrad)"/>

  <!-- subtitle -->
  <text x="600" y="222" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" letter-spacing="5" fill="#a5f3fc">COMPUTER ENGINEERING STUDENT</text>
  <text x="600" y="252" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" letter-spacing="3" fill="#8b949e">SOFTWARE DEVELOPER • GPU COMPUTING • RESEARCH</text>

  <!-- sparkles -->
  <g fill="#22d3ee">
    <circle cx="250" cy="70" r="2.5">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="76" r="2.5" fill="#ec4899">
      <animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="280" r="2.5" fill="#8b5cf6">
      <animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="890" cy="272" r="2.5">
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
